<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>فحص الشاشة</title>
</head>
<body>

<h1>فحص مشاركة الشاشة</h1>

<button onclick="checkScreen()">فحص</button>

<p id="result">لم يتم الفحص بعد.</p>

<script>
function checkScreen() {
  if (navigator.mediaDevices &&
      navigator.mediaDevices.getDisplayMedia) {
    document.getElementById("result").textContent =
      "Chrome يتعرف على وظيفة مشاركة الشاشة.";
  } else {
    document.getElementById("result").textContent =
      "وظيفة مشاركة الشاشة غير متاحة هنا.";
  }
}
</script>

</body>
</html>
